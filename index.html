<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProjectPilot AI — From Idea to Implementation</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-indigo-500 selection:text-white flex flex-col">
  <!-- Top Navigation Bar -->
  <header class="sticky top-0 z-40 glass-panel border-b border-slate-800/80 no-print">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <!-- Logo & Brand -->
      <div class="flex items-center gap-3 cursor-pointer" onclick="switchTab('wizard')">
        <div class="w-10 h-10 rounded-xl gradient-bg flex items-center justify-center text-white text-xl font-black shadow-lg shadow-indigo-600/30">
          🎓
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="font-extrabold text-base tracking-tight text-white">ProjectPilot <span class="text-indigo-400 font-black">AI</span></span>
            <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">v1.0</span>
          </div>
          <p class="text-[10px] text-slate-400">“From Idea to Implementation”</p>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <nav id="main-nav" class="hidden md:flex items-center gap-1">
        <!-- Injected dynamically by app.js -->
      </nav>

      <!-- Right Actions: Status Badge & Settings -->
      <div class="flex items-center gap-3">
        <div id="api-status-badge">
          <!-- Injected dynamically -->
        </div>

        <button onclick="openSettingsModal()" title="Engine Settings & Gemini API Key"
          class="p-2 rounded-xl bg-slate-900/80 hover:bg-slate-800 text-slate-400 hover:text-white border border-slate-700 transition-colors">
          ⚙️
        </button>
      </div>
    </div>
  </header>

  <!-- Mobile Sub-navigation Bar -->
  <div class="md:hidden glass-panel border-b border-slate-800/80 px-4 py-2 flex items-center gap-1 overflow-x-auto no-print">
    <button onclick="switchTab('wizard')" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-900 text-slate-300 whitespace-nowrap">Profile & Ideas</button>
    <button onclick="switchTab('ideas')" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-900 text-slate-300 whitespace-nowrap">Showcase</button>
    <button onclick="switchTab('project')" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-900 text-slate-300 whitespace-nowrap">Workspace</button>
    <button onclick="switchTab('dashboard')" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-900 text-slate-300 whitespace-nowrap">Dashboard</button>
    <button onclick="switchTab('mentor')" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-900 text-slate-300 whitespace-nowrap">AI Mentor</button>
  </div>

  <!-- Main Content Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div id="view-container">
      <!-- Injected dynamically by app.js -->
    </div>
  </main>

  <!-- Modals Container -->
  <div id="modal-container"></div>

  <!-- App Footer -->
  <footer class="mt-auto border-t border-slate-900 py-6 text-center text-xs text-slate-500 no-print">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
      <span>ProjectPilot AI — Empowering final-year engineering students from idea to viva defense.</span>
      <div class="flex items-center gap-4">
        <a href="javascript:void(0)" onclick="switchTab('wizard')" class="hover:text-slate-300 transition-colors">Generator</a>
        <a href="javascript:void(0)" onclick="switchTab('dashboard')" class="hover:text-slate-300 transition-colors">Dashboard</a>
        <a href="javascript:void(0)" onclick="openSettingsModal()" class="hover:text-slate-300 transition-colors">API Config</a>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="app.js"></script>
</body>
</html>
